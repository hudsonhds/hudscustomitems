main: com.hudscustomitems.customitems.CustomItemsPlugin
name: ${NAME}
version: "${VERSION}"
api-version: "26.1"
author: HUDS
description: Command-first custom items for Paper 1.26.1 through 1.26.1.2
softdepend: [ProtocolLib]
commands:
  customitems:
    description: Manage and use custom items
    usage: "Use /customitems help"
    aliases: [ci, citems]
permissions:
  customitems.admin:
    description: Full access to all custom item commands
    default: op
  customitems.use:
    description: Allows using custom item abilities
    default: true
  customitems.*:
    description: Grants all customitems permissions
    default: false
    children:
      customitems.admin: true
      customitems.use: true
